services:
  - type: web
    name: sentrix-core-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SENTRIX_MODE
        value: MOCK
      - key: SENTRIX_DB_PATH
        value: /tmp/sentrix.db
